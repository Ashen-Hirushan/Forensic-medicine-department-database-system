{% extends 'base.html' %}

{% block page_title %}Register Clinical Case (MLEF){% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 800px; margin: 0 auto;">
    <h3 class="card-title">New Clinical Examination</h3>
    <form action="/clinical/new" method="POST">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <!-- Patient Demographics -->
            <div class="form-group">
                <label class="form-label">Patient NIC</label>
                <input type="text" name="nic" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Patient Full Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Age</label>
                <input type="number" name="age" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-control">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">Permanent Address</label>
                <input type="text" name="address" class="form-control">
            </div>

            <!-- Case Details -->
            <div class="form-group">
                <label class="form-label">Hospital BHT No.</label>
                <input type="text" name="hospital_bht_no" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Police Reference No.</label>
                <input type="text" name="reference_no" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Incident Date</label>
                <input type="datetime-local" name="incident_date" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Admission Date</label>
                <input type="datetime-local" name="admission_date" class="form-control">
            </div>
            
            <!-- Assigment -->
            <div class="form-group">
                <label class="form-label">Facility ID</label>
                <input type="number" name="facility_id" class="form-control" value="1">
            </div>
            <div class="form-group">
                <label class="form-label">Assigned Doctor ID</label>
                <input type="number" name="assigned_doctor_id" class="form-control" value="1">
            </div>
        </div>
        
        <div style="margin-top: 30px; text-align: right;">
            <a href="/clinical" class="btn" style="color: var(--text-muted);">Cancel</a>
            <button type="submit" class="btn btn-primary">Save & Register Case</button>
        </div>
    </form>
</div>
{% endblock %}
