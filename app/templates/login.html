<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Forensic System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, hsla(230, 40%, 15%, 1) 0%, var(--bg-dark) 100%);
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        .login-logo {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
            color: var(--primary-color);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="login-container glass-card">
        <div class="login-logo">
            ⚕️ ForensicDB
        </div>
        
        <div class="alert-container">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Secure Login</button>
        </form>
    </div>
</body>
</html>
