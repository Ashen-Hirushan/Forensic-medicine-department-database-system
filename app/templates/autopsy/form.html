{% extends 'base.html' %}

{% block page_title %}Register Autopsy Case (PMR){% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 800px; margin: 0 auto;">
    <h3 class="card-title">New Autopsy Investigation</h3>
    <form action="/autopsy/new" method="POST">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <!-- Cadaver Details -->
            <div class="form-group">
                <label class="form-label">Cadaver NIC (if known)</label>
                <input type="text" name="nic" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Name (if known)</label>
                <input type="text" name="name" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Estimated Age</label>
                <input type="number" name="estimated_age" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-control">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Unknown">Unknown</option>
                </select>
            </div>
            
            <div class="form-group" style="grid-column: span 2;">
                <label class="form-label">Address Found / From</label>
                <input type="text" name="address_found" class="form-control">
            </div>

            <!-- Case Details -->
            <div class="form-group">
                <label class="form-label">Death Datetime</label>
                <input type="datetime-local" name="death_datetime" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">PM Serial No.</label>
                <input type="text" name="pm_serial_no" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label">Inquest Ordered By</label>
                <select name="inquest_ordered_by" class="form-control">
                    <option value="Magistrate">Magistrate</option>
                    <option value="Coroner">Coroner</option>
                    <option value="ISD">ISD</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Inquest Order No.</label>
                <input type="text" name="inquest_order_no" class="form-control">
            </div>
            
            <!-- Assigment -->
            <div class="form-group">
                <label class="form-label">Assigned Doctor ID</label>
                <input type="number" name="assigned_doctor_id" class="form-control" value="1">
            </div>
            <div class="form-group">
                <label class="form-label">Station ID</label>
                <input type="number" name="station_id" class="form-control" value="1">
            </div>
        </div>
        
        <div style="margin-top: 30px; text-align: right;">
            <a href="/autopsy" class="btn" style="color: var(--text-muted);">Cancel</a>
            <button type="submit" class="btn btn-primary">Save & Register Autopsy</button>
        </div>
    </form>
</div>
{% endblock %}
