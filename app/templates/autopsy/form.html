{% extends 'base.html' %}

{% block page_title %}Register Autopsy Case{% endblock %}

{% block content %}
<div class="card" style="max-width: 860px;">
    <h2 style="font-size: var(--font-size-xl); font-weight: 600; margin-bottom: var(--space-6);">New Autopsy Investigation (PMR)</h2>

    <form action="/autopsy/new" method="POST">
        <!-- Cadaver Details -->
        <div class="form-section">
            <div class="form-section-title">Cadaver Information</div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">NIC (if known)</label>
                    <input type="text" name="nic" class="form-control" placeholder="NIC number if identified">
                </div>
                <div class="form-group">
                    <label class="form-label">Name (if known)</label>
                    <input type="text" name="name" class="form-control" placeholder="Name if identified">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Estimated Age</label>
                    <input type="number" name="estimated_age" class="form-control" placeholder="e.g. 60" min="0" max="150">
                </div>
                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select name="gender" class="form-control">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Unknown</option>
                    </select>
                </div>
            </div>
            <div class="form-row full">
                <div class="form-group">
                    <label class="form-label">Address Found / From</label>
                    <input type="text" name="address_found" class="form-control" placeholder="Location where body was found">
                </div>
            </div>
        </div>

        <!-- Case Details -->
        <div class="form-section">
            <div class="form-section-title">Case Details</div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Death Date & Time</label>
                    <input type="datetime-local" name="death_datetime" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">PM Serial No.</label>
                    <input type="text" name="pm_serial_no" class="form-control" placeholder="e.g. CW/PM/24-001">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Admission Date & Time</label>
                    <input type="datetime-local" name="admission_date" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Autopsy Date & Time</label>
                    <input type="datetime-local" name="autopsy_date" class="form-control">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Hospital BHT No.</label>
                    <input type="text" name="hospital_bht_no" class="form-control" placeholder="e.g. BHT-88123">
                </div>
                <div class="form-group">
                    <label class="form-label">Manner of Death</label>
                    <select name="manner_of_death" class="form-control">
                        <option value="">— Select —</option>
                        <option value="Natural">Natural</option>
                        <option value="Accidental">Accidental</option>
                        <option value="Suicidal">Suicidal</option>
                        <option value="Homicidal">Homicidal</option>
                        <option value="Undetermined">Undetermined</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Inquest Ordered By</label>
                    <select name="inquest_ordered_by" class="form-control">
                        <option value="Magistrate">Magistrate</option>
                        <option value="Coroner">Coroner</option>
                        <option value="ISD">Inquirer into Sudden Deaths (ISD)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Inquest Order No.</label>
                    <input type="text" name="inquest_order_no" class="form-control" placeholder="e.g. ISD/24/055">
                </div>
            </div>
            <div class="form-row full">
                <div class="form-group">
                    <label class="form-label">Place of Postmortem</label>
                    <input type="text" name="place_of_postmortem" class="form-control" placeholder="e.g. Teaching Hospital Peradeniya Mortuary">
                </div>
            </div>
        </div>

        <!-- Assignment -->
        <div class="form-section">
            <div class="form-section-title">Assignment</div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Assigned Doctor</label>
                    <select name="assigned_doctor_id" class="form-control">
                        {% for d in doctors %}
                        <option value="{{ d.doctor_id }}">{{ d.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Police Station</label>
                    <select name="station_id" class="form-control">
                        {% for s in stations %}
                        <option value="{{ s.station_id }}">{{ s.station_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="form-actions">
            <a href="/autopsy" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save & Register Autopsy</button>
        </div>
    </form>
</div>
{% endblock %}
